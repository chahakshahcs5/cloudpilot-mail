<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=420, initial-scale=1.0">
  <title>CloudPilot Mail</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/email.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/utilities.css">
  <link rel="stylesheet" href="css/role-select.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-container" id="app">

    <!-- ═══ ROLE SELECTION SCREEN ═══ -->
    <div class="role-select-screen" id="role-select-screen" style="display:none">
    </div>

    <!-- ═══ HEADER ═══ -->
    <header class="app-header" id="app-header">
      <div class="header-brand">
        <svg class="header-logo" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#3B82F6"/>
              <stop offset="100%" stop-color="#8B5CF6"/>
            </linearGradient>
          </defs>
          <rect width="32" height="32" rx="8" fill="url(#logo-grad)"/>
          <rect x="6.5" y="10" width="19" height="12" rx="2" fill="white" opacity="0.95"/>
          <path d="M6.5 12l9.5 5.5 9.5-5.5" stroke="url(#logo-grad)" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="header-title">CloudPilot Mail</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-theme" title="Toggle theme"></button>
        <button class="icon-btn" id="btn-settings" title="Settings"></button>
      </div>
    </header>

    <!-- ═══ WORKER SELECTOR ═══ -->
    <div class="worker-selector" id="worker-bar">
      <label id="worker-label">WORKER</label>
      <select id="worker-select"></select>
    </div>

    <!-- ═══ TAB NAVIGATION ═══ -->
    <nav class="tab-nav" id="tab-nav"></nav>

    <!-- ═══ MAIN CONTENT ═══ -->
    <main class="content-area" id="content-area">
      <!-- Dashboard -->
      <section class="view-panel" id="view-dashboard"></section>
      <!-- Addresses -->
      <section class="view-panel" id="view-addresses"></section>
      <!-- Inbox -->
      <section class="view-panel" id="view-inbox"></section>
      <!-- Sent -->
      <section class="view-panel" id="view-sent"></section>
      <!-- Send Access -->
      <section class="view-panel" id="view-send_access"></section>
      <!-- Compose -->
      <section class="view-panel" id="view-compose"></section>
      <!-- Settings -->
      <section class="view-panel" id="view-settings"></section>
    </main>

    <!-- ═══ TOAST CONTAINER ═══ -->
    <div class="toast-container" id="toast-container"></div>

    <!-- ═══ MODAL CONTAINER ═══ -->
    <div id="modal-root"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
